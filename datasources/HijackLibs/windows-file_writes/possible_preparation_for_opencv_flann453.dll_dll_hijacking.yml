title: Possible preparation for opencv_flann453.dll DLL Hijacking
id: 7730522b-5716-48a3-7286-5b9ff8770141
status: experimental
description: Detects possible DLL hijacking of opencv_flann453.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/on1/opencv_flann453.html
author: "Jose Enrique Hernandez"
date: 2026-10-13
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\opencv_flann453.dll'

    condition: selection 
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

