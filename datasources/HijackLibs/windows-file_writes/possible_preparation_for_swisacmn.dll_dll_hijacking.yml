title: Possible preparation for swisacmn.dll DLL Hijacking
id: 8854462b-5716-48a3-7286-5b9ff8614959
status: experimental
description: Detects possible DLL hijacking of swisacmn.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/sonicwall/swisacmn.html
author: "Jose Enrique Hernandez"
date: 2026-10-13
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\swisacmn.dll'

    condition: selection 
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

