title: Possible preparation for dsp_ippv2_x64.dll DLL Hijacking
id: 8624042b-3513-48a3-4540-5b9ff8328618
status: experimental
description: Detects possible DLL hijacking of dsp_ippv2_x64.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/abbyy/dsp_ippv2_x64.html
author: "Wietze Beukema"
date: 2026-09-01
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\dsp_ippv2_x64.dll'
    filter:
        TargetFileName:
            - 'c:\program files\ABBYY FineReader *\\*'
            - 'c:\program files (x86)\ABBYY FineReader *\\*'
            - 'c:\program files\Image-Line\FL Studio *\Shared\\*'
            - 'c:\program files (x86)\Image-Line\FL Studio *\Shared\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

