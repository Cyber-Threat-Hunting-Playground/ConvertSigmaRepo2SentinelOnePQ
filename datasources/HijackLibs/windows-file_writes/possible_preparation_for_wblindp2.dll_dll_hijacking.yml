title: Possible preparation for wblindp2.dll DLL Hijacking
id: 3394062b-4996-48a3-6789-5b9ff8174260
status: experimental
description: Detects possible DLL hijacking of wblindp2.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/stardock/wblindp2.html
author: "Harry Godridge - HuntressLabs"
date: 2026-07-30
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\wblindp2.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Stardock\WindowBlinds\\*'
            - 'c:\program files (x86)\Stardock\WindowBlinds\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

