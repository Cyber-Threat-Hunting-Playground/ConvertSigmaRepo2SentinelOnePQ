title: Possible preparation for vim64.dll DLL Hijacking
id: 7261472b-1982-48a3-5760-5b9ff8224953
status: experimental
description: Detects possible DLL hijacking of vim64.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/vim/vim64.html
author: "Daniel Koifman"
date: 2026-09-29
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\vim64.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Vim\\*'
            - 'c:\program files (x86)\Vim\\*'
            - 'c:\program files\Vim\vim*\\*'
            - 'c:\program files (x86)\Vim\vim*\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

