title: Possible preparation for ceiinfolog.dll DLL Hijacking
id: 2847262b-3801-48a3-5206-5b9ff8544728
status: experimental
description: Detects possible DLL hijacking of ceiinfolog.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/canon/ceiinfolog.html
author: "Liran Ravich"
date: 2026-10-01
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\ceiinfolog.dll'

    condition: selection 
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

