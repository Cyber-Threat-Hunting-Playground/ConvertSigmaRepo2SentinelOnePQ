title: Possible preparation for mingwm10.dll DLL Hijacking
id: 3658202b-3513-48a3-4540-5b9ff8927087
status: experimental
description: Detects possible DLL hijacking of mingwm10.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/mingw/mingwm10.html
author: "Wietze Beukema"
date: 2026-09-01
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\mingwm10.dll'

    condition: selection 
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

