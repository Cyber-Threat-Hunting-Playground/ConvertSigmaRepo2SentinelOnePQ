title: Possible preparation for windowspackagemanager.dll DLL Hijacking
id: 2593002b-5476-48a3-2908-5b9ff8728377
status: experimental
description: Detects possible DLL hijacking of windowspackagemanager.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/microsoft/built-in/windowspackagemanager.html
author: "Iván Cabrera"
date: 2026-09-18
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\windowspackagemanager.dll'
    filter:
        TargetFileName:
            - 'c:\program files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\\*'
            - 'c:\program files (x86)\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

