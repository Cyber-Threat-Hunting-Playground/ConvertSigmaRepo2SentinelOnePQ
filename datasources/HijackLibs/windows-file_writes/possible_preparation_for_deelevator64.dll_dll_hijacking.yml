title: Possible preparation for deelevator64.dll DLL Hijacking
id: 4348502b-3801-48a3-5206-5b9ff8566686
status: experimental
description: Detects possible DLL hijacking of deelevator64.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/stardock/deelevator64.html
author: "Liran Ravich"
date: 2026-10-01
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\deelevator64.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Stardock\Start11\\*'
            - 'c:\program files (x86)\Stardock\Start11\\*'
            - 'c:\program files\Stardock\Fences\\*'
            - 'c:\program files (x86)\Stardock\Fences\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

