title: Possible preparation for wwide9.dll DLL Hijacking
id: 3190462b-5716-48a3-7286-5b9ff8368962
status: experimental
description: Detects possible DLL hijacking of wwide9.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/ibm/wwide9.html
author: "Jose Enrique Hernandez"
date: 2026-10-13
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\wwide9.dll'
    filter:
        TargetFileName:
            - 'c:\program files\IBM\SPSS\Statistics\\*\\*'
            - 'c:\program files (x86)\IBM\SPSS\Statistics\\*\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

