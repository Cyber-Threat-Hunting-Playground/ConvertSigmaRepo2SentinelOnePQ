title: Possible preparation for libfftw3-3.dll DLL Hijacking
id: 6628732b-5716-48a3-7286-5b9ff8986277
status: experimental
description: Detects possible DLL hijacking of libfftw3-3.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/fftw/libfftw3-3.html
author: "Jose Enrique Hernandez"
date: 2026-10-13
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\libfftw3-3.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Blue Iris *\\*'
            - 'c:\program files (x86)\Blue Iris *\\*'
            - 'c:\program files\Blue Iris\\*'
            - 'c:\program files (x86)\Blue Iris\\*'
            - 'C:\BlueIris\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

