title: Possible preparation for eztwain4.dll DLL Hijacking
id: 6065472b-9354-48a3-1039-5b9ff8146942
status: experimental
description: Detects possible DLL hijacking of eztwain4.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/atalasoft/eztwain4.html
author: "Jose Enrique Hernandez"
date: 2026-10-17
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\eztwain4.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Nitro\PDF Pro\\*\\*'
            - 'c:\program files (x86)\Nitro\PDF Pro\\*\\*'
            - 'c:\program files\Nitro\Pro *\\*'
            - 'c:\program files (x86)\Nitro\Pro *\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

