title: Possible preparation for reflecttheme.dll DLL Hijacking
id: 6255482b-6911-48a3-5228-5b9ff8567031
status: experimental
description: Detects possible DLL hijacking of reflecttheme.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/macrium/reflecttheme.html
author: "Austin Worline"
date: 2026-08-11
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\reflecttheme.dll'

    condition: selection 
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

