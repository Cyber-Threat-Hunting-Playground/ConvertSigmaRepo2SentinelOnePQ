title: Possible preparation for msvfw32.dll DLL Hijacking
id: 6616392b-5812-48a3-7097-5b9ff8750140
status: experimental
description: Detects possible DLL hijacking of msvfw32.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/microsoft/built-in/msvfw32.html
author: "Tim Sword - HuntressLabs"
date: 2026-10-23
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\msvfw32.dll'
    filter:
        TargetFileName:
            - 'c:\windows\syswow64\\*'
            - 'c:\windows\system32\\*'
            - 'c:\windows\winsxs\*'
            - 'c:\$windows.~bt\*'
            - 'c:\windows\softwaredistribution\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

