title: Possible preparation for maxkernl.dll DLL Hijacking
id: 6687042b-3465-48a3-2559-5b9ff8561934
status: experimental
description: Detects possible DLL hijacking of maxkernl.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/nuance/maxkernl.html
author: "Harry Godridge - HuntressLabs"
date: 2026-08-27
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\maxkernl.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Nuance\PaperPort\\*'
            - 'c:\program files (x86)\Nuance\PaperPort\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

