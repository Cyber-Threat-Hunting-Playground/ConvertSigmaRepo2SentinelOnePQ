title: Possible preparation for cdlmso.dll DLL Hijacking
id: 8613932b-8442-48a3-5283-5b9ff8887785
status: experimental
description: Detects possible DLL hijacking of cdlmso.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/microsoft/external/cdlmso.html
author: "Adam Mooney - HuntressLabs"
date: 2026-07-14
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\cdlmso.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Microsoft Office\Office14\\*'
            - 'c:\program files (x86)\Microsoft Office\Office14\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

