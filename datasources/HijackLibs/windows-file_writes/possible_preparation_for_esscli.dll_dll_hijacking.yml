title: Possible preparation for esscli.dll DLL Hijacking
id: 5842142b-5476-48a3-2908-5b9ff8659418
status: experimental
description: Detects possible DLL hijacking of esscli.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/microsoft/built-in/esscli.html
author: "Iván Cabrera"
date: 2026-09-18
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\esscli.dll'
    filter:
        TargetFileName:
            - 'c:\windows\system32\wbem\\*'
            - 'c:\windows\winsxs\*'
            - 'c:\$windows.~bt\*'
            - 'c:\windows\softwaredistribution\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

