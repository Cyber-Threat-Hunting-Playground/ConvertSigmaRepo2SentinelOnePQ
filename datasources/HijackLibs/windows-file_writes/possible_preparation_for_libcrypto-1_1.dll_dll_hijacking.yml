title: Possible preparation for libcrypto-1_1.dll DLL Hijacking
id: 9426192b-5092-48a3-3345-5b9ff8221281
status: experimental
description: Detects possible DLL hijacking of libcrypto-1_1.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/aomei/libcrypto-1_1.html
author: "Harry Godridge - HuntressLabs"
date: 2026-08-09
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\libcrypto-1_1.dll'
    filter:
        TargetFileName:
            - 'c:\program files\AOMEI Partition Assistant\\*'
            - 'c:\program files (x86)\AOMEI Partition Assistant\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

