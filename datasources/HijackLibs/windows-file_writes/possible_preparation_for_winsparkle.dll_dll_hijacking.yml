title: Possible preparation for winsparkle.dll DLL Hijacking
id: 7811742b-1982-48a3-5760-5b9ff8388588
status: experimental
description: Detects possible DLL hijacking of winsparkle.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/winsparkle/winsparkle.html
author: "Daniel Koifman"
date: 2026-09-29
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\winsparkle.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Poedit\\*'
            - 'c:\program files (x86)\Poedit\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

