title: Possible preparation for utils.dll DLL Hijacking
id: 2729532b-4564-48a3-7410-5b9ff8258876
status: experimental
description: Detects possible DLL hijacking of utils.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/comodo/utils.html
author: "Austin Worline"
date: 2026-06-15
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\utils.dll'

    condition: selection 
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

