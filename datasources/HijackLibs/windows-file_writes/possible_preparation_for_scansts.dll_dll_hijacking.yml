title: Possible preparation for scansts.dll DLL Hijacking
id: 7777592b-3513-48a3-4540-5b9ff8870402
status: experimental
description: Detects possible DLL hijacking of scansts.dll by looking for suspicious file writes of this DLL, to unexpected locations.
references:
    - https://hijacklibs.net/entries/3rd_party/quickheal/scansts.html
author: "Wietze Beukema"
date: 2026-09-01
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFileName: '*\scansts.dll'
    filter:
        TargetFileName:
            - 'c:\program files\Quick Heal\Quick Heal *\\*'
            - 'c:\program files (x86)\Quick Heal\Quick Heal *\\*'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

