title: Possibly malicious versions of vim64.dll
id: 7261473b-1982-48a3-5760-5b9ff8224953
status: experimental
description: Detects possible DLL hijacking of vim64.dll by looking for versions not meeting the known signature data.
references:
    - https://hijacklibs.net/entries/3rd_party/vim/vim64.html
author: "Daniel Koifman"
date: 2026-09-29
tags:
    - attack.defense_evasion
    - attack.T1574.001
logsource:
    product: windows
    category: image_load
detection:
    selection:
        ImageLoaded: '*\vim64.dll'
    filter:
        ImageLoaded:
            - Signed: 'true'
            - SignatureStatus: 'signed'
            - Signature|contains:
                - 'CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US'

    condition: selection and not filter
falsepositives:
    - False positives are likely. This rule is more suitable for hunting than for generating detections.

